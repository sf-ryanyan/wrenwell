<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wrenwell 匠维</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Wrenwell — a bilingual job, dispatch and customer system demo for home service contractors.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: navy system shell + calm navy-tinted work area; brass is the one vivid colour.
   Colour wheel: complementary — navy H258 (30%) vs brass H80 (10%) on a tinted neutral field (60%).
   Each trade gets its own accent hue (--ind-h) used only on that trade's own features. */
:root{
  --ind-h: 225;
  --bg: oklch(97.6% 0.006 258);
  --surface: oklch(99.6% 0.002 258);
  --surface-2: oklch(95.4% 0.008 258);
  --line: oklch(90.5% 0.01 258);
  --ink: oklch(23% 0.03 258);
  --ink-2: oklch(41% 0.025 258);
  --ink-3: oklch(51% 0.02 258);
  --brand: oklch(29% 0.06 258);
  --brand-2: oklch(35% 0.06 258);
  --brand-ink: oklch(95% 0.01 258);
  --brand-ink-2: oklch(76% 0.03 258);
  --accent: oklch(77% 0.12 80);
  --accent-strong: oklch(52% 0.1 72);
  --accent-soft: oklch(94.5% 0.04 85);
  --on-accent: oklch(22% 0.035 70);
  --ind: oklch(54% 0.11 var(--ind-h));
  --ind-soft: oklch(94.5% 0.03 var(--ind-h));
  --ind-on-brand: oklch(86% 0.07 var(--ind-h));
  --ok: oklch(48% 0.11 150); --ok-soft: oklch(94.5% 0.04 150);
  --warn: oklch(53% 0.13 55); --warn-soft: oklch(94.5% 0.045 65);
  --err: oklch(52% 0.17 25); --err-soft: oklch(95% 0.03 25);
  --info: oklch(47% 0.1 258); --info-soft: oklch(94.5% 0.03 258);
  --bar: oklch(36% 0.06 258 / .85);
  --lead: oklch(29% 0.06 258);
  --scrim: oklch(15% 0.03 258 / .5);
  --shadow: 0 1px 2px oklch(20% 0.03 258 / .05), 0 10px 28px oklch(20% 0.03 258 / .07);
  --f-ui: "Geist", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px; --slot: 26px;
  --ease: cubic-bezier(0.16,1,0.3,1);
}
:root[data-ind="plumbing"]{--ind-h:195}
:root[data-ind="garage"]{--ind-h:300}
:root[data-ind="handyman"]{--ind-h:135}
:root[data-ind="cleaning"]{--ind-h:350}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg: oklch(18.5% 0.02 258); --surface: oklch(22% 0.022 258); --surface-2: oklch(26% 0.022 258); --line: oklch(32% 0.022 258);
  --ink: oklch(94% 0.01 258); --ink-2: oklch(81% 0.015 258); --ink-3: oklch(70% 0.015 258);
  --brand: oklch(14.5% 0.024 258); --brand-2: oklch(21% 0.03 258);
  --accent: oklch(80% 0.11 82); --accent-strong: oklch(82% 0.11 82); --accent-soft: oklch(31% 0.05 80);
  --ind: oklch(78% 0.1 var(--ind-h)); --ind-soft: oklch(31% 0.05 var(--ind-h));
  --ok: oklch(77% 0.12 150); --ok-soft: oklch(30% 0.05 150);
  --warn: oklch(79% 0.12 62); --warn-soft: oklch(31% 0.06 60);
  --err: oklch(75% 0.14 25); --err-soft: oklch(31% 0.07 25);
  --info: oklch(79% 0.08 258); --info-soft: oklch(31% 0.05 258);
  --bar: oklch(48% 0.05 258); --scrim: oklch(5% 0.02 258 / .65); --lead: oklch(30% 0.065 258);
  --shadow: 0 1px 2px oklch(0% 0 0 / .3), 0 10px 28px oklch(0% 0 0 / .32);
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --bg: oklch(18.5% 0.02 258); --surface: oklch(22% 0.022 258); --surface-2: oklch(26% 0.022 258); --line: oklch(32% 0.022 258);
  --ink: oklch(94% 0.01 258); --ink-2: oklch(81% 0.015 258); --ink-3: oklch(70% 0.015 258);
  --brand: oklch(14.5% 0.024 258); --brand-2: oklch(21% 0.03 258);
  --accent: oklch(80% 0.11 82); --accent-strong: oklch(82% 0.11 82); --accent-soft: oklch(31% 0.05 80);
  --ind: oklch(78% 0.1 var(--ind-h)); --ind-soft: oklch(31% 0.05 var(--ind-h));
  --ok: oklch(77% 0.12 150); --ok-soft: oklch(30% 0.05 150);
  --warn: oklch(79% 0.12 62); --warn-soft: oklch(31% 0.06 60);
  --err: oklch(75% 0.14 25); --err-soft: oklch(31% 0.07 25);
  --info: oklch(79% 0.08 258); --info-soft: oklch(31% 0.05 258);
  --bar: oklch(48% 0.05 258); --scrim: oklch(5% 0.02 258 / .65); --lead: oklch(30% 0.065 258);
  --shadow: 0 1px 2px oklch(0% 0 0 / .3), 0 10px 28px oklch(0% 0 0 / .32);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;line-break:strict;word-break:normal}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:4px}
#view:focus,#troot:focus{outline:none}
.mono{font-family:var(--f-mono);font-size:.92em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;word-break:keep-all}
p{margin:0}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:6px;z-index:100}
.skip:focus{left:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 15px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:550;font-size:14px;white-space:nowrap;transition:transform .15s var(--ease),background .2s,border-color .2s;text-decoration:none;color:var(--ink)}
.btn svg{width:16px;height:16px;flex:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.dark{background:var(--ink);border-color:transparent;color:var(--bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.danger{background:var(--err);border-color:transparent;color:var(--surface)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px}
.btn.lg{min-height:48px;font-size:15px;padding:0 20px}
.btn.block{width:100%}
@media (hover:hover){.btn:hover{border-color:var(--ink-3)}.btn.primary:hover{background:oklch(from var(--accent) calc(l - .04) c h)}.btn.dark:hover{background:oklch(from var(--ink) calc(l + .06) c h)}.btn.ghost:hover{background:var(--surface-2)}}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.card-h .meta{font-size:13px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12.5px;font-weight:550;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.plain::before{display:none}
.s-new{background:var(--warn-soft);color:var(--warn)}
.s-scheduled,.s-sent{background:var(--info-soft);color:var(--info)}
.s-inprogress{background:var(--accent-soft);color:var(--accent-strong)}
.s-done,.s-accepted{background:var(--ok-soft);color:var(--ok)}
.s-paid,.s-draft{background:var(--surface-2);color:var(--ink-2)}
.s-overdue,.s-emg{background:var(--err-soft);color:var(--err)}
.s-ind{background:var(--ind-soft);color:var(--ind)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid-7-5{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:18px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:14px;border:1px dashed var(--line);border-radius:var(--r)}
.muted{color:var(--ink-3)} .small{font-size:13px}
.icon-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);position:relative;color:var(--ink-2);flex:none}
.icon-btn svg{width:17px;height:17px}
.icon-btn .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:99px;background:var(--err);color:var(--surface);font-size:11px;font-weight:650;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--info-soft);color:var(--info)}
.avatar.lg{width:52px;height:52px;font-size:18px}
.avatar.brass{background:var(--accent);color:var(--on-accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:13.5px;font-weight:550;color:var(--ink-2)}
.field label em{font-style:normal;color:var(--err)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:44px;padding:0 12px;width:100%}
.field textarea{padding:10px 12px;min-height:76px;resize:vertical}
.field .err{font-size:13px;color:var(--err)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface-2);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;padding:6px 12px;font-size:13.5px;font-weight:550;color:var(--ink-3);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.full{display:flex}.seg.full button{flex:1}
.link{background:none;border:0;padding:0;color:var(--accent-strong);font-weight:550;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.demo-note{display:flex;gap:10px;font-size:13px;color:var(--ink-2);background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.demo-note svg{width:16px;height:16px;flex:none;margin-top:3px;color:var(--accent-strong)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:var(--surface);padding:6px 11px;font-size:13px;color:var(--ink-3);min-width:40px;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Login */
.login{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.l-art{background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;justify-content:space-between;gap:40px;padding-block:44px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:48px;position:relative;overflow:hidden}
.l-art::after{content:"";position:absolute;right:-180px;bottom:-200px;width:520px;height:520px;border-radius:50%;background:radial-gradient(in oklch, oklch(from var(--accent) l c h / .22), transparent 68%);pointer-events:none}
.l-brand{display:flex;align-items:center;gap:12px}
.l-brand svg{width:36px;height:36px}
.l-brand b{font-size:20px;font-weight:650;display:block;line-height:1.1}
.l-brand small{color:var(--brand-ink-2);font-size:13px}
.l-art h2{font-size:clamp(32px,3.6vw,48px);line-height:1.18;font-weight:650;letter-spacing:-.025em;max-width:14em}
.l-art h2 span{color:var(--accent)}
.l-art .lead{color:var(--brand-ink-2);font-size:16px;max-width:36em;margin-top:16px}
.l-trades{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.l-trades span{border:1px solid oklch(from var(--brand-ink) l c h / .2);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--brand-ink-2)}
.l-mock{position:relative;display:grid;gap:10px;max-width:440px;z-index:1}
.l-mock div{background:oklch(from var(--brand-ink) l c h / .07);border:1px solid oklch(from var(--brand-ink) l c h / .12);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.l-mock b{font-size:14px;font-weight:600;display:block}
.l-mock span{font-size:12.5px;color:var(--brand-ink-2);display:block}
.l-mock time{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.l-mock i{font-style:normal;font-size:12px;padding:2px 9px;border-radius:99px;background:oklch(from var(--accent) l c h / .2);color:var(--accent);white-space:nowrap}
.l-mock > div:nth-child(2){margin-left:28px}.l-mock > div:nth-child(3){margin-left:56px}
.l-mock div div{display:block;background:none;border:0;padding:0}
.l-form{display:flex;flex-direction:column;padding-block:28px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.l-top{display:flex;justify-content:flex-end;gap:8px}
.l-box{margin:auto;width:min(400px,100%);display:flex;flex-direction:column;gap:18px;padding-block:24px}
.l-box h1{font-size:28px;font-weight:650;letter-spacing:-.02em}
.l-box .sub{color:var(--ink-2);margin-top:6px}
.l-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;flex-wrap:wrap}
.l-row label{display:flex;gap:8px;align-items:center;color:var(--ink-2)}
.l-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent-strong)}
.l-foot{font-size:12.5px;color:var(--ink-3);text-align:center}
.loading{min-height:100dvh;display:grid;place-items:center;gap:16px;align-content:center;color:var(--ink-3)}
.loading svg{width:52px;height:52px;animation:breathe 1.2s var(--ease) infinite alternate}
@keyframes breathe{from{transform:scale(.92);opacity:.6}to{transform:scale(1);opacity:1}}

/* Shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100dvh}
.side{background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;gap:28px;padding:22px 14px 18px;position:sticky;top:0;height:100dvh;padding-left:max(14px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo svg{width:30px;height:30px;flex:none}
.logo b{font-size:18px;font-weight:650;letter-spacing:-.01em;display:block;line-height:1.1}
.logo small{display:block;font-size:12px;color:var(--brand-ink-2);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--brand-ink-2);text-decoration:none;font-weight:500;transition:background .2s,color .2s}
.nav a svg{width:18px;height:18px;flex:none}
.nav a .tag{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;background:oklch(from var(--ind-on-brand) l c h / .18);color:var(--ind-on-brand);white-space:nowrap}
@media (hover:hover){.nav a:hover{background:var(--brand-2);color:var(--brand-ink)}}
.nav a[aria-current="page"]{background:var(--brand-2);color:var(--brand-ink);box-shadow:inset 2px 0 0 var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.side-foot p{font-size:12px;color:var(--brand-ink-2);line-height:1.6}
.side-btn{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid oklch(from var(--brand-ink) l c h / .18);color:var(--brand-ink-2);border-radius:8px;padding:8px 10px;font-size:13px}
.side-btn svg{width:15px;height:15px}
@media (hover:hover){.side-btn:hover{color:var(--brand-ink);border-color:oklch(from var(--brand-ink) l c h / .35)}}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:oklch(from var(--bg) l c h / .9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.ind-switch{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.ind-switch button{border:0;background:transparent;border-radius:7px;padding:6px 11px;font-size:13px;font-weight:500;color:var(--ink-3);white-space:nowrap;display:flex;align-items:center;gap:6px;min-height:32px}
.ind-switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ind-switch i{width:7px;height:7px;border-radius:50%;display:block;background:oklch(62% 0.12 var(--h))}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;position:relative}
.user-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px 3px 3px;min-height:38px}
.user-btn .avatar{width:30px;height:30px;font-size:12px}
.user-btn b{font-size:13px;font-weight:600}
.pop{position:absolute;top:calc(100% + 8px);right:0;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(340px,calc(100vw - 32px));padding:8px;animation:pop .22s var(--ease);max-height:70dvh;overflow:auto}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;gap:10px}
.pop-h b{font-weight:600;display:block}
.pop-h span{font-size:12.5px;color:var(--ink-3);display:block}
.pop a,.pop .mi{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:8px;text-decoration:none;color:var(--ink);border:0;background:transparent;width:100%;text-align:left;font-size:14px}
.pop a svg,.pop .mi svg{width:17px;height:17px;flex:none;margin-top:2px;color:var(--ink-3)}
@media (hover:hover){.pop a:hover,.pop .mi:hover{background:var(--surface-2)}}
.pop .n-dot{width:8px;height:8px;border-radius:50%;background:var(--sev,var(--info));flex:none;margin-top:7px}
.pop .n-t b{display:block;font-weight:550;font-size:14px}
.pop .n-t span{display:block;font-size:12.5px;color:var(--ink-3)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.view{padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1320px;width:100%;display:flex;flex-direction:column;gap:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:13px;color:var(--ink-3);margin-bottom:4px}
.vh h1{font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.vh .sub{color:var(--ink-2);margin-top:6px;max-width:62ch}
.vh-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0;text-decoration:none;color:inherit;transition:border-color .2s}
@media (hover:hover){a.kpi:hover{border-color:var(--ink-3)}}
.kpi .k-l{font-size:13px;color:var(--ink-3);font-weight:500}
.kpi .k-v{font-size:32px;font-weight:620;letter-spacing:-.025em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:13px;color:var(--ink-2)}

function revChart(now){
  const vals=[...D().rev, now], months=[];
  for(let i=5;i>=0;i--) months.push(new Date(todayD.getFullYear(), todayD.getMonth()-i, 1).getMonth());
  const max=Math.ceil(Math.max(...vals)/10000)*10000||10000;
  const W=560,H=230,padL=44,padB=28,padT=24, ch=H-padB-padT, bw=48, gap=(W-padL-6*bw)/6;
  const y=v=>padT+ch-(v/max)*ch;
  let g=''; [0,max/2,max].forEach(v=>{ g+=`<line class="grid" x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL-8}" y="${y(v)+4}" text-anchor="end">${v?moneyK(v):'$0'}</text>`; });
  const bars = vals.map((v,i)=>{ const x=padL+gap/2+i*(bw+gap), last=i===5; return `<rect class="bar ${last?'now':''}" x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(2,ch-(y(v)-padT))}" rx="4"/><text class="v" x="${x+bw/2}" y="${y(v)-7}" text-anchor="middle">${moneyK(v)}</text><text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(last?t().nowMonth:t().monthShort(months[i]))}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t().revenue)}">${g}${bars}</svg>`;
}

function saveJob(j){
  const tt=t(), g=id=>modal.querySelector(id), d=D();

  if(techId && !date){ err.hidden=false; g('#f-date').focus(); return; }
  err.hidden=true; const noteTxt=g('#f-note').value.trim();

    const s=svc(svcId); const nj={id:++d.counters.job,cust:g('#f-cust').value,svc:svcId,date:null,start:null,mins:s.mins,tech:null,status:'new',note:{zh:noteTxt,en:noteTxt},amount:s.price,emg:svcId==='emergency',check:[],signed:false};
    if(techId && date){ if(conflict(nj, techId, date, start)){ toast(tt.conflict); d.counters.job--; return; } Object.assign(nj,{tech:techId,date,start,status:'scheduled'}); }
    d.jobs.push(nj); save(); closeModal(); render(); toast(tt.created(nj.id));
  } else {
    if(techId && date && conflict(j, techId, date, start)){ toast(tt.conflict); return; }
    if(j.status==='new'||j.status==='scheduled'){ const s=svc(svcId); j.svc=svcId; j.mins=s.mins; j.amount=s.price; j.emg=svcId==='emergency'; }
    if(L(j.note)!==noteTxt) j.note={zh:noteTxt,en:noteTxt};
    if(techId && date){ j.tech=techId; j.date=date; j.start=start; if(j.status==='new') j.status='scheduled'; }
    else if(j.status==='new'||j.status==='scheduled'){ j.tech=null; j.date=null; j.start=null; j.status='new'; }
    save(); closeModal(); render(); toast(tt.saved);
  }
}

    let drawing=false, dirty=false;

  openCust:el=>{ UI.selCust=el.dataset.id; closeModal(); if(location.hash!=='#customers') location.hash='#customers'; else render(); },
  selCust:el=>{ UI.selCust=el.dataset.id; render(); const dd=document.querySelector('.cdetail'); if(dd && innerWidth<1024) dd.scrollIntoView({behavior:'smooth',block:'start'}); },
  jFilter:el=>{ UI.jFilter=el.dataset.v; render(); },
  day:el=>{ const v=+el.dataset.v; UI.day = v===0 ? TODAY : addDays(UI.day,v); render(); },
  qtab:el=>{ UI.qtab=el.dataset.v; if(route()==='quotes') render(); },
  selEst:el=>{ UI.selEst=el.dataset.id; render(); },
  gotoEst:el=>{ UI.qtab='est'; UI.selEst=el.dataset.id; if(location.hash!=='#quotes') location.hash='#quotes'; else render(); },
  makeQuote:el=>makeQuote(el.dataset.cust),
  acceptTier:el=>{ const e=D().estimates.find(x=>x.id===el.dataset.id); const no=acceptEstimate(e,+el.dataset.i); render(); toast(t().estAccepted(no)); },
  custView:el=>{ UI.cvPick=1; custView(el.dataset.id); },
  cvPick:el=>{ UI.cvPick=+el.dataset.i; custView(el.dataset.id); },
  cvApprove:el=>{ const tt=t(), e=D().estimates.find(x=>x.id===el.dataset.id), i=UI.cvPick; const no=acceptEstimate(e,i); closeModal(); render(); toast(tt.cv_ok([tt.good,tt.better,tt.best][i],no)); },
  newCust:()=>custForm(null),
  editCust:el=>custForm(cust(el.dataset.id)),
  sendEst:el=>{ const tt=t(), e=D().estimates.find(x=>x.id===el.dataset.id), c=cust(e.cust), pr=e.tiers.map(x=>money(x.price)+(x.unit==='visit'?tt.perVisit:'')); smsModal({title:tt.sms_est,to:tt.sms_one(c.name,c.phone),body:tt.smsEstBody(first(c.name),L(e.title),pr[0],pr[1],pr[2]),onSend:()=>{ e.status='sent'; e.sent=TODAY; toast(tt.estSent); }}); },
  markPaid:el=>{ const i=D().invoices.find(x=>x.no===el.dataset.no); i.paid=TODAY; const j=job(i.job); if(j) j.status='paid'; save(); render(); toast(t().paidT); },
  remindInv:el=>{ const tt=t(), i=D().invoices.find(x=>x.no===el.dataset.no), c=cust(i.cust); smsModal({title:tt.sms_inv,to:tt.sms_one(c.name,c.phone),body:tt.smsInvBody(first(c.name),i.no,money(i.amount)),onSend:()=>toast(tt.estSent)}); },
  season:el=>{ UI.season=el.dataset.v; UI.sel.clear(); render(); },
  pick:el=>{ el.checked?UI.sel.add(el.dataset.id):UI.sel.delete(el.dataset.id); render(); },
  pickAll:()=>{ (UI.ind==='hvac'?hvacDue():rebookList()).filter(x=>!x.booked&&!x.reminded).forEach(x=>UI.sel.add(x.c.id)); render(); },
  sendRemind:()=>{ const tt=t(), ids=[...UI.sel]; if(!ids.length) return; const c0=cust(ids[0]), nm=first(c0.name); let body, key;
    if(UI.ind==='hvac'){ const sw=L(HV.season[UI.season]); key=UI.season;
      body = zh() ? (c0.member?`${nm} 您好，${sw}的时间到了。作为保养会员，这次检修已包含在会员费里。回复 1 预约本周，回复 2 我们打电话给您。—— Wrenwell`:`${nm} 您好，${sw}的时间到了。年度检修 $189，能提前发现问题、降低电费。回复 1 预约本周。现在加入保养会员（$219/年，含两次检修），这次检修免费。—— Wrenwell`)
        : (c0.member?`Hi ${nm}, it's time for your ${sw.toLowerCase()}. As a plan member, this visit is included. Reply 1 to book this week, or 2 and we'll call you. — Wrenwell`:`Hi ${nm}, it's time for your ${sw.toLowerCase()}. A yearly tune-up is $189 and catches problems early. Reply 1 to book this week. Join our plan ($219/yr, two visits) and this visit is free. — Wrenwell`); }
    else { key='rebook'; body = zh() ? `${nm} 您好，好久不见！家里有没有攒下要修的小活？挂画、补墙、调门、换灯都可以一次做完。本月预约人工 9 折，回复 1 我们帮你排时间。—— Wrenwell` : `Hi ${nm}, it's been a while! Any small fixes piling up at home? Art, drywall, doors and lights can all be done in one visit. Book this month for 10% off labor. Reply 1 and we'll find a time. — Wrenwell`; }
    smsModal({title:tt.sms_rem,to:ids.length>1?tt.sms_to(ids.length):tt.sms_one(c0.name,c0.phone),body,onSend:()=>{ ids.forEach(id=>D().reminders[key+':'+id]=TODAY); UI.sel.clear(); toast(tt.remSent(ids.length)); }}); },
  emgSend:el=>emgSend(+el.dataset.id),
  gset:el=>{ UI.gc[el.dataset.g]=el.dataset.v; if(el.dataset.g==='mat'&&el.dataset.v==='glass') UI.gc.win=false; render(); },
  gtog:el=>{ UI.gc[el.dataset.g]=!UI.gc[el.dataset.g]; render(); },
  gQuote:()=>garageQuote(),
  hq:el=>{ const id=el.dataset.id; UI.hb[id]=Math.max(0,Math.min(9,(UI.hb[id]||0)+(+el.dataset.v))); render(); },
  hQuote:()=>handyQuote(),
  ctype:el=>{ UI.cc.type=el.dataset.v; render(); },
  cQuote:()=>cleanQuote(),
  askReset:()=>{ UI.pop=null; const tt=t(); openModal(`<div><div class="m-h"><div><h2 id="m-title">${esc(tt.resetQ)}</h2><p>${esc(tt.resetP)}</p></div></div><div class="m-f" style="padding-top:20px"><button class="btn ghost" type="button" data-action="closeModal" autofocus>${esc(tt.cancel)}</button><button class="btn dark" type="button" data-action="doReset">${esc(tt.resetDo)}</button></div></div>`); },
  doReset:()=>{ S={v:2,seededOn:TODAY,ind:{}}; save(); UI.armed=null; UI.sel.clear(); UI.selCust='c1'; UI.selEst=null; UI.day=TODAY; UI.photos={}; closeModal(); render(); toast(t().resetDone); },
  tBack:()=>{ UI.tdone=null; UI.warnFor=null; if(location.hash!=='#tech') location.hash='#tech'; else render(); },
  tStart:el=>{ const j=job(+el.dataset.id); j.status='inprogress'; save(); render(); toast(t().t_started); },
  tFinish:el=>{ const j=job(+el.dataset.id), n=C().checklist.zh.length, miss=n-(j.check||[]).filter(Boolean).length;
    if(miss>0 && UI.warnFor!==j.id){ UI.warnFor=j.id; render(); document.getElementById('t-warn')?.scrollIntoView({behavior:'smooth',block:'center'}); return; }
    UI.warnFor=null; finishJob(j); save(); UI.tdone=j.id; render(); scrollTo(0,0); },
  sigClear:()=>{ const cv=document.getElementById('t-sig'); if(!cv) return; cv.getContext('2d').clearRect(0,0,cv.width,cv.height); const j=job(+cv.dataset.id); if(j){ j.signed=false; save(); } },
  copyPhone:el=>{ const v=el.dataset.v; try{ navigator.clipboard.writeText(v).then(()=>toast(t().t_copied),()=>toast(t().t_copyFail)); }catch(e){ toast(t().t_copyFail); } }
};

/* ================= Events ================= */
document.addEventListener('click', e=>{
  if(UI.pop && !e.target.closest('.pop') && !e.target.closest('[data-action="pop"]')){ UI.pop=null; if(!e.target.closest('[data-action]')){ render(); return; } }
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action; if(a==='pick'||a==='tcheck') return;
  if(el.tagName==='A' && a==='qtab'){ UI.qtab=el.dataset.v; if(route()==='quotes') render(); return; }
  e.preventDefault(); if(actions[a]) actions[a](el);
});
document.addEventListener('change', e=>{
  const el=e.target; if(!el.dataset) return;
  if(el.dataset.action==='pick') actions.pick(el);
  if(el.dataset.action==='tcheck'){ const j=job(+el.dataset.id); j.check=j.check||[]; j.check[+el.dataset.i]=el.checked; save(); const y=scrollY; render(); scrollTo(0,y); }
  if(el.dataset.bind) UI[el.dataset.bind]=el.value;
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(TOUR.on){ endTour(); return; } if(UI.pop){ UI.pop=null; render(); return; } }
  if(e.key!=='Enter' && e.key!==' ') return;
  if(e.target.matches('[role="button"][data-action]')){ e.preventDefault(); actions[e.target.dataset.action](e.target); }
  else if(e.target.matches('.blk')){ e.preventDefault(); jobModal(job(+e.target.dataset.drag)); }
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.id==='cust-q'){ UI.q=el.value; const pos=el.selectionStart; render(); const q=document.getElementById('cust-q'); q.focus(); try{q.setSelectionRange(pos,pos)}catch(_){} }
  if(el.id && el.id.startsWith('calc-')) updateCalc();
  if(el.dataset && el.dataset.cc){ UI.cc[el.dataset.cc]=+el.value; const id=el.id, y=scrollY; render(); scrollTo(0,y); document.getElementById(id)?.focus({preventScroll:true}); }
});
window.addEventListener('hashchange', ()=>{
  if(!session) return;
  UI.pop=null; render();
  if(!TOUR.on){ (document.getElementById('view')||document.getElementById('troot'))?.focus({preventScroll:true}); scrollTo(0,0); }
});

/* Dispatch drag & tap-to-assign */
document.addEventListener('pointerdown', e=>{
  const src=e.target.closest('[data-drag]'); if(!src || !session || inTech() || route()!=='dispatch') return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  const id=+src.dataset.drag, j=job(id), r=src.getBoundingClientRect(), locked=j.status==='done'||j.status==='paid';
  const sx=e.clientX, sy=e.clientY, offX=sx-r.left, offY=src.dataset.chip?12:sy-r.top;
  const sl=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--slot'))||26;
  let ghost=null, hint=null, moved=false;
  const target=ev=>document.elementsFromPoint(ev.clientX,ev.clientY).map(x=>x.closest&&x.closest('.dcol')).find(Boolean)||null;
  const slotFor=(col,y)=>{ const cr=col.getBoundingClientRect(); const s=Math.round((y-offY-cr.top)/sl()); return Math.max(0,Math.min(SLOTS-j.mins/30,s)); };
  const move=ev=>{
    if(locked || (!moved && Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)) return;
    if(!moved){ moved=true; ghost=src.cloneNode(true); ghost.classList.add('drag-ghost'); ghost.style.width=r.width+'px'; ghost.style.height=src.dataset.chip?'auto':r.height+'px'; document.body.appendChild(ghost); src.classList.add('dragging'); }
    ghost.style.transform=`translate(${ev.clientX-offX}px,${ev.clientY-offY}px)`;
    const col=target(ev); document.querySelectorAll('.dcol.target').forEach(c=>c!==col&&c.classList.remove('target'));
    if(col){ col.classList.add('target'); const s=slotFor(col,ev.clientY); if(!hint){ hint=document.createElement('div'); hint.className='drop-hint'; } hint.style.top=`calc(var(--slot) * ${s} + 2px)`; hint.style.height=`calc(var(--slot) * ${j.mins/30} - 4px)`; if(hint.parentNode!==col) col.appendChild(hint); }
    else if(hint) hint.remove();
  };
  const up=ev=>{
    window.removeEventListener('pointermove',move);
    if(!moved){ if(src.dataset.chip){ UI.armed=UI.armed===id?null:id; render(); } else jobModal(j); return; }
    const col=target(ev); ghost.remove(); if(hint) hint.remove(); src.classList.remove('dragging'); document.querySelectorAll('.dcol.target').forEach(c=>c.classList.remove('target'));
    if(!col){ toast(t().outside); return; }
    assign(j, col.dataset.tech, START_H*60+slotFor(col,ev.clientY)*30);
  };
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up,{once:true});
  window.addEventListener('pointercancel',()=>{ window.removeEventListener('pointermove',move); if(ghost) ghost.remove(); if(hint) hint.remove(); src.classList.remove('dragging'); },{once:true});
});
document.addEventListener('click', e=>{
  if(!session || inTech() || route()!=='dispatch') return;
  const chip=e.target.closest('.tchip'); if(chip && e.detail===0){ const id=+chip.dataset.drag; UI.armed=UI.armed===id?null:id; render(); return; }
  if(!UI.armed) return;
  const col=e.target.closest('.dcol'); if(!col || e.target.closest('.blk')) return;
  const j=job(UI.armed), cr=col.getBoundingClientRect(), sl=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--slot'))||26;
  const s=Math.max(0,Math.min(SLOTS-j.mins/30,Math.floor((e.clientY-cr.top)/sl)));
  assign(j, col.dataset.tech, START_H*60+s*30);
});
function assign(j, techId, start){
  const tt=t();
  if(conflict(j, techId, UI.day, start)){ toast(tt.conflict); render(); return; }
  j.tech=techId; j.date=UI.day; j.start=start; if(j.status==='new') j.status='scheduled';
  UI.armed=null; save(); render(); toast(tt.assigned(cust(j.cust).name, tech(techId).name, `${relDay(UI.day)} ${fmtTime(start)}`));
}

/* ================= Boot ================= */
if(session && session.role==='owner' && /^#(tech|job-)/.test(location.hash)) history.replaceState(null,'',location.pathname+location.search+'#overview');
if(session && session.role==='tech' && !/^#(tech|job-)/.test(location.hash)) history.replaceState(null,'',location.pathname+location.search+'#tech');
render();
})();
</script>
